<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Keepers</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" media="print" onload="this.media='all'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23272d3a'/%3E%3Cpath d='M17 34.5l9.5 9.5L47 21' fill='none' stroke='%23ff8a4c' stroke-width='7.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23272d3a'/%3E%3Cpath d='M47 96l27 27 60-70' fill='none' stroke='%23ff8a4c' stroke-width='21' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<meta name="description" content="Sort a photo dump into collections and build the final cut. Files stay on your device.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#dde3ee;--hi:#ffffff;--lo:#adb8cb;--tx:#1c2330;--mu:#596377;--ac:#e8551d;--ac2:#ff9a5c;--cool:#5f6bff;
--grad:linear-gradient(135deg,#ffa267 0%,#e8551d 100%);--gradc:linear-gradient(135deg,#8b96ff 0%,#4f5cff 100%);
--line:#ffffffcc;--glass:rgba(223,229,239,.82);--glow:0 18px 38px -22px rgba(140,58,18,.55);
--page:radial-gradient(1200px 820px at 6% -10%,#ffffffd0,transparent 62%),radial-gradient(900px 620px at 100% 2%,#ffd8c4b8,transparent 58%),radial-gradient(900px 900px at 46% 120%,#ccd7ffb0,transparent 62%);
--up:8px 8px 20px #b8c2d4,-8px -8px 20px #ffffff;--us:4px 4px 10px #bcc6d8,-4px -4px 10px #ffffff;--dn:inset 4px 4px 9px #bcc6d8,inset -4px -4px 9px #ffffff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#20242c;--hi:#2b303a;--lo:#14171c;--tx:#eef1f7;--mu:#9aa3b4;--ac:#ff8f52;--ac2:#ffc39a;--cool:#818cff;
--line:#ffffff1f;--glass:rgba(32,36,44,.84);--glow:0 18px 38px -20px #000000aa;
--page:radial-gradient(1100px 760px at 8% -10%,#39414fbb,transparent 60%),radial-gradient(900px 620px at 100% 0,#5a3120a0,transparent 56%),radial-gradient(820px 820px at 48% 118%,#2a3463aa,transparent 62%);
--up:8px 8px 20px #14171c,-8px -8px 20px #2b303a;--us:4px 4px 10px #14171c,-4px -4px 10px #2b303a;--dn:inset 4px 4px 9px #14171c,inset -4px -4px 9px #2b303a}}
:root[data-theme="dark"]{--bg:#20242c;--hi:#2b303a;--lo:#14171c;--tx:#eef1f7;--mu:#9aa3b4;--ac:#ff8f52;--ac2:#ffc39a;--cool:#818cff;
--line:#ffffff1f;--glass:rgba(32,36,44,.84);--glow:0 18px 38px -20px #000000aa;
--page:radial-gradient(1100px 760px at 8% -10%,#39414fbb,transparent 60%),radial-gradient(900px 620px at 100% 0,#5a3120a0,transparent 56%),radial-gradient(820px 820px at 48% 118%,#2a3463aa,transparent 62%);
--up:8px 8px 20px #14171c,-8px -8px 20px #2b303a;--us:4px 4px 10px #14171c,-4px -4px 10px #2b303a;--dn:inset 4px 4px 9px #14171c,inset -4px -4px 9px #2b303a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip}*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font:14px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-optical-sizing:auto;min-height:100%;position:relative;overflow-x:clip;background:var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--page)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-image:radial-gradient(#3a4a6b26 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:radial-gradient(135% 90% at 50% 0%,#000 30%,transparent 78%);mask-image:radial-gradient(135% 90% at 50% 0%,#000 30%,transparent 78%)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
button{background:var(--bg);border:0;border-radius:14px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--us);transition:box-shadow .15s}
button:active{box-shadow:var(--dn)}
.pri{color:var(--ac);font-weight:700}
.shell{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:28px 20px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{font-weight:700;font-size:22px;letter-spacing:-.04em;padding:0 6px}
.prog{height:12px;border-radius:12px;box-shadow:var(--dn);padding:3px}.prog div{height:100%;border-radius:8px;background:var(--ac);min-width:6px;transition:width .3s}
.pl{padding:0 6px;color:var(--mu);font-size:12px;margin-top:-8px}
nav{display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:24px;box-shadow:var(--dn)}
.col{background:none;box-shadow:none;border-radius:16px;padding:11px 12px;width:100%;text-align:left}
.col:hover{color:var(--ac)}.col.on{box-shadow:var(--us);font-weight:600;color:var(--tx)}
.col i{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset 1px 1px 2px #0005,inset -1px -1px 2px #fff6;opacity:.55}
.col.on i{opacity:1;box-shadow:0 0 9px currentColor,inset 1px 1px 2px #fff8}
.col span{flex:1}.col b{color:var(--mu);font-weight:500;font-variant-numeric:tabular-nums}
.col u{text-decoration:none;color:var(--mu);display:none}.col:hover u{display:inline-flex}
.add{display:flex;gap:10px;padding:0 2px}.add input{flex:1;min-width:0;background:var(--bg);border:0;box-shadow:var(--dn);border-radius:14px;padding:10px 14px;outline:0}
.add input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.main{padding:30px 34px 24px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.top h2{margin:0;font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1}.top .c{color:var(--mu)}
.sp{flex:1}
.seg{display:inline-flex;box-shadow:var(--dn);border-radius:16px;padding:4px;gap:2px}.seg button{box-shadow:none;background:none;padding:7px 16px;border-radius:12px}.seg button.on{box-shadow:var(--us);font-weight:600}
select{background:var(--bg);border:0;box-shadow:var(--dn);border-radius:14px;padding:10px 12px}
.stage{display:flex;justify-content:center}
.card{position:relative;display:flex;width:fit-content;height:auto;max-width:100%;padding:14px;background:var(--bg);border-radius:38px;box-shadow:var(--up);touch-action:none;user-select:none;cursor:grab}
.med{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu);text-align:center;padding:14px}
.card .med{position:relative;inset:auto;flex:0 0 auto;min-width:200px;min-height:200px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:26px;overflow:hidden;background:#0d0e11;box-shadow:inset 0 0 0 1px #0006;color:#aab}
.med img,.med video,.med canvas{pointer-events:none}
.med video{pointer-events:auto}
.card .med img,.card .med canvas,.card .med video{display:block;width:auto;height:auto;max-width:520px;max-height:min(66vh,640px);object-fit:contain}
.cmp .med img,.cmp .med canvas,.cmp .med video{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
.cell img,.cell video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.cell canvas{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.med canvas{image-rendering:auto}
.cap{position:absolute;left:14px;right:14px;bottom:14px;padding:34px 18px 14px;border-radius:0 0 26px 26px;background:linear-gradient(transparent,#000c);color:#fff;font-size:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.stamp{position:absolute;top:30px;font-weight:700;font-size:15px;padding:6px 14px;border:2px solid;border-radius:12px;opacity:0;pointer-events:none;background:#000b}
.acts{display:flex;justify-content:center;gap:20px;margin-top:34px;flex-wrap:wrap}
.rnd{flex-direction:column;justify-content:center;gap:2px;width:80px;height:80px;padding:0;border-radius:50%;box-shadow:var(--up)}.rnd small{font-size:11px;color:var(--mu)}
.rnd:active{box-shadow:var(--dn)}
.mv{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px;align-items:center;color:var(--mu);font-size:12px}
.mv button{padding:6px 14px;border-radius:20px;font-size:12px}
.help{color:var(--mu);font-size:12px;text-align:center;margin-top:22px;display:flex;gap:6px 14px;justify-content:center;flex-wrap:wrap}
kbd{border-radius:7px;padding:1px 7px;font:inherit;font-size:11px;box-shadow:var(--us);margin-right:4px;color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,158px),1fr));gap:22px}
.vgrid{position:relative;width:100%}
.vgrid .cell{position:absolute;left:0;top:0;aspect-ratio:auto;contain:layout paint style;will-change:transform}
.vcell .med{transition:transform .18s ease}
.vcell:hover .med{transform:translateY(-3px)}
.cell{position:relative;aspect-ratio:1;border-radius:22px;box-shadow:var(--dn);cursor:pointer}
.cell .med{inset:8px;border-radius:15px;overflow:hidden;background:#0d0e11;padding:4px;font-size:11px}
.cell img,.cell video,.cell canvas{object-fit:cover}
.cell.sel{box-shadow:var(--dn),0 0 0 3px var(--ac)}
.tick{position:absolute;top:14px;left:14px;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:var(--us);display:flex;align-items:center;justify-content:center;color:var(--ac);opacity:0}
.cell:hover .tick,.cell.sel .tick{opacity:1}
.open{position:absolute;right:14px;bottom:14px;padding:6px;border-radius:10px;opacity:0}.cell:hover .open{opacity:1}
.kill{position:absolute;right:14px;top:14px;padding:6px;border-radius:10px;opacity:0;color:#c93a3a;z-index:2}
.cell:hover .kill{opacity:1}.kill:hover{background:#c93a3a;color:#fff}
/* composition guide lines over the photo */
.gd{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.gd svg{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1.5px #0009)}
.gd line{vector-effect:non-scaling-stroke;stroke-linecap:round}
.card .gd{inset:14px;border-radius:26px}
/* compare two photos */
.cmpwrap{max-width:1120px;margin:0 auto}
.cmpbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.cmpbar .sp{flex:1}.cmpbar b{font-size:15px;letter-spacing:-.02em}
.cmp{display:flex;gap:18px;align-items:stretch}
.cmp .pane{flex:1 1 0;min-width:0;background:var(--bg);border-radius:26px;box-shadow:var(--up);padding:12px;display:flex;flex-direction:column;gap:10px}
.cmp .cshot{position:relative;height:min(56vh,540px);border-radius:18px;overflow:hidden;background:#0d0e11;box-shadow:inset 0 0 0 1px #0006}
.cmp .cshot .med{position:absolute;inset:0;padding:0;display:flex;align-items:center;justify-content:center}
.cmp .cshot .cap{position:absolute;left:0;right:0;bottom:0;border-radius:0;padding:30px 14px 10px;background:linear-gradient(transparent,#000c);font-size:12px}
.cmp .judge{display:flex;gap:8px}
.cmp .judge button{flex:1;justify-content:center;gap:6px;font-size:12.5px}
.cmp .judge .ok{color:#12865a}.cmp .judge .bad{color:#c93a3a}
.cmp .slotempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;color:#8b93a7;font-size:13px;line-height:1.5}
.hintrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;color:var(--mu);font-size:12px;margin-top:16px}
.num{position:absolute;top:14px;left:14px;background:var(--bg);box-shadow:var(--us);color:var(--ac);border-radius:12px;padding:0 9px;font-weight:700;font-size:13px;z-index:1}
.ord{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between}.ord button{padding:5px 7px;border-radius:10px}
#bulk{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--bg);border-radius:26px;box-shadow:var(--up);padding:12px 16px;display:none;gap:10px;align-items:center;flex-wrap:wrap;max-width:94vw;z-index:5}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:start}
.panel{border-radius:30px;box-shadow:var(--up);padding:24px;margin-bottom:28px}.panel h3{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:-.02em}
.over{color:#d23f3f}
textarea{width:100%;min-height:96px;background:var(--bg);border:0;box-shadow:var(--dn);border-radius:16px;padding:14px;outline:0;resize:vertical}
textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 14px}.chips button{border-radius:20px;padding:5px 14px;font-size:12px}.chips .on{box-shadow:var(--dn);color:var(--ac);font-weight:600}
.song{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-top:1px solid var(--lo);box-shadow:0 -1px 0 var(--hi)}.song a{color:var(--ac);text-decoration:none;margin-left:12px;font-size:12px;font-weight:600}
.empty{text-align:center;color:var(--mu);padding:70px 10px;border-radius:30px;box-shadow:var(--dn)}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.hero>div.in{max-width:560px;padding:56px 48px;border-radius:48px;box-shadow:var(--up);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.hero h1{font-size:50px;letter-spacing:-.05em;margin:0;line-height:1;font-weight:700}.hero p{color:var(--mu);margin:0}
.hero button{padding:14px 24px}.hide{display:none!important}
/* custom dropdowns */
.dd{background:var(--bg);box-shadow:var(--dn);border-radius:14px;padding:0 12px;height:42px;display:inline-flex;align-items:center;gap:8px;max-width:230px}
.dd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.dd .car{opacity:.6;flex:none}
.dd.sm{height:36px;padding:0 11px;border-radius:12px}
.menu{position:fixed;z-index:120;background:var(--bg);box-shadow:var(--up);border-radius:18px;padding:6px;display:flex;flex-direction:column;gap:2px;animation:pop .12s ease}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}}
.menu button{box-shadow:none;background:none;border-radius:12px;padding:9px 12px;text-align:left;width:100%;font-size:13px;justify-content:flex-start}
.menu button:hover{background:var(--hi)}
.menu button.on{font-weight:600;color:var(--ac)}
.menu i{width:9px;height:9px;border-radius:50%;flex:none}
.menu .sepr{height:1px;background:var(--lo);margin:5px 4px}
/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--bg);box-shadow:var(--dn);border-radius:14px;padding:0 10px;height:42px;color:var(--mu)}
.search input{background:none;border:0;outline:0;width:132px;font-size:13px;color:var(--tx)}
.search input::placeholder{color:var(--mu)}
.search button{padding:3px;border-radius:8px;box-shadow:none;background:none;color:var(--mu)}
/* settings sheet */
.sheet{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:#0006;padding:18px}
.sheet.on{display:flex}
.sheet .pane{width:min(600px,96vw);max-height:88vh;overflow:auto;background:var(--bg);border-radius:32px;box-shadow:var(--up);padding:26px 26px 18px}
.sheet .pane::-webkit-scrollbar{width:8px}.sheet .pane::-webkit-scrollbar-thumb{background:var(--lo);border-radius:8px}
.sheet h3{margin:0;font-size:21px;letter-spacing:-.03em;font-weight:700}
.sheet .sub{color:var(--mu);font-size:12px;margin:4px 0 0}
.sec{margin-top:20px}
.sec h4{margin:0 0 2px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:600}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--lo)}
.sec .row:first-of-type{border-top:0}
.row .lab{flex:1;min-width:0}
.row .lab b{font-weight:600;font-size:13px;display:block}
.row .lab small{color:var(--mu);font-size:11.5px;display:block;line-height:1.45}
.row .end{display:flex;align-items:center;gap:10px;flex:none}
.sw{width:46px;height:26px;border-radius:20px;box-shadow:var(--dn);position:relative;flex:none;padding:0;background:var(--bg)}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--hi);box-shadow:var(--us);transition:left .16s,background .16s}
.sw[aria-pressed="true"]{background:var(--ac)}
.sw[aria-pressed="true"]::after{left:24px;background:#fff}
input[type=color]{-webkit-appearance:none;appearance:none;width:34px;height:24px;padding:0;border:0;border-radius:8px;background:none;box-shadow:var(--dn);cursor:pointer;flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:8px}
input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:8px;background:var(--bg);box-shadow:var(--dn);width:120px;flex:none;outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ac);box-shadow:var(--us);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--ac);cursor:pointer}
.sheet .foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.dgr{color:#d23f3f}
/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#14161b;color:#fff;padding:11px 16px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:200;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:#2b303a;color:#fff;box-shadow:none;padding:5px 10px;border-radius:9px;font-size:12px}
.asideFoot{display:flex;flex-direction:column;gap:10px}
@media(max-width:820px){.cmp{flex-direction:column}.cmp .cshot{height:min(32vh,300px)}
.card .med img,.card .med canvas,.card .med video{max-width:calc(100vw - 64px);max-height:min(58vh,520px)}
.shell{grid-template-columns:1fr}aside{position:static;height:auto;padding:16px 16px 6px;gap:12px}
nav{flex-direction:row;overflow-x:auto}.col{width:auto;white-space:nowrap}
.asideFoot{flex-direction:row}.asideFoot button{flex:1;justify-content:center;font-size:13px;padding:9px 10px}
#topSet{display:none}.two{grid-template-columns:1fr}.main{padding:10px 16px 92px}
.top{gap:8px;margin-bottom:18px}.top h2{font-size:26px}.acts{gap:12px}.rnd{width:66px;height:66px}.rnd small{font-size:10px}
.search input{width:96px}.search{flex:1;min-width:150px}.dd{max-width:160px}.card{border-radius:30px}
.sheet .pane{padding:20px 18px 14px;border-radius:26px}.menu{max-width:min(320px,92vw)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- visual layer ---------- */
.shell,.hero{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;font-size:21px}
.brand .mark{width:30px;height:30px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;box-shadow:var(--glow),inset 0 1px 0 #ffffff66}
.hero{overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;pointer-events:none;z-index:0}
.blob.b1{width:min(46vw,430px);height:min(46vw,430px);background:#ff9a5c;top:6%;left:4%;animation:float1 22s ease-in-out infinite}
.blob.b2{width:min(42vw,400px);height:min(42vw,400px);background:#7c88ff;bottom:6%;right:5%;animation:float1 26s ease-in-out infinite reverse}
@keyframes float1{50%{transform:translate3d(34px,-30px,0) scale(1.1)}}
.hero>div.in{position:relative;z-index:1;background:linear-gradient(160deg,#ffffffd9,#ffffff8c);border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:var(--up),var(--glow)}

/* ---------- local storage (IndexedDB) ---------- */
let DB=null,dbReady=null;
function openDB(){
  if(dbReady)return dbReady;
  dbReady=new Promise(ok=>{
    let r;try{r=indexedDB.open('dump-curator',2)}catch(e){return ok(null)}
    r.onupgradeneeded=()=>{const d=r.result;
      if(d.objectStoreNames.contains('media'))d.deleteObjectStore('media'); // old full-size JPEG cache

      if(!d.objectStoreNames.contains('assets'))d.createObjectStore('assets')};
    r.onsuccess=()=>{DB=r.result;ok(DB)};
    r.onerror=()=>ok(null);r.onblocked=()=>ok(null);
    setTimeout(()=>ok(DB),1500);

const objUrls=new Map(),objOrder=[];
function objUrl(key,blob,force){
  if(!force){const hit=objUrls.get(key);if(hit)return hit}
  const u=URL.createObjectURL(blob);

  while(objOrder.length>400){const k=objOrder.shift();const old=objUrls.get(k);if(old&&k!==key){URL.revokeObjectURL(old);objUrls.delete(k)}}

function injectScript(code){

    s.onerror=()=>{URL.revokeObjectURL(u);try{(0,eval)(code);ok(!!window.HeicTo)}catch(e){ok(false)}};

}
function heicLib(){
  if(window.HeicTo)return Promise.resolve(window.HeicTo);

  heicLibP=(async()=>{
    const code=await decoderSource();
    if(!window.HeicTo&&!(await injectScript(code)))throw new Error('HEIC decoder failed to start');
    return window.HeicTo;
  })();
  heicLibP.catch(()=>{heicLibP=null});

/* ---------- decode worker: libheif off the main thread ---------- */
const stats={worker:0,main:0};
try{window.__keepers={stats}}catch(e){}
const WORKER_GLUE = `
self.onmessage=async function(e){
  var d=e.data;
  try{
    if(!self.HeicTo) throw new Error('decoder missing in worker');
    var opt={};
    if(d.maxEdge&&d.w&&d.h&&Math.max(d.w,d.h)>d.maxEdge){
      /* one edge only. createImageBitmap keeps the aspect ratio when a single edge
         is given, so a size hint that is off (rotation, crop, odd container) can
         never squash the photo. It can only leave it a little larger than asked. */
      if(d.w>=d.h) opt.resizeWidth=d.maxEdge; else opt.resizeHeight=d.maxEdge;
      opt.resizeQuality='high';
    }
    var bmp=await self.HeicTo({blob:d.file,type:'bitmap',options:opt});
    var out={id:d.id,ok:true,width:bmp.width,height:bmp.height};
    out.bitmap=bmp;
    var transfer=[bmp];
    if(d.tileEdge){
      var sc=Math.min(1,d.tileEdge/Math.max(bmp.width,bmp.height));
      var oc=new OffscreenCanvas(Math.max(1,Math.round(bmp.width*sc)),Math.max(1,Math.round(bmp.height*sc)));
      var g2=oc.getContext('2d');
      g2.imageSmoothingQuality='high';
      g2.drawImage(bmp,0,0,oc.width,oc.height);
      var q=d.tileQ||0.82;
      try{out.tile=await oc.convertToBlob({type:'image/webp',quality:q})}
      catch(err){out.tile=await oc.convertToBlob({type:'image/jpeg',quality:q})}
    }
    self.postMessage(out,transfer);
  }catch(err){
    self.postMessage({id:d.id,ok:false,err:String((err&&(err.message||err))||err)});
  }
};
`;
let wk=null,wkP=null,wkSeq=0;const wkPend=new Map();
function workerInstance(){
  if(wk)return Promise.resolve(wk);
  if(wkP)return wkP;
  wkP=(async()=>{
    if(typeof Worker==='undefined'||typeof OffscreenCanvas==='undefined')throw new Error('worker path unavailable');
    const code=await decoderSource();
    const url=URL.createObjectURL(new Blob([code+'\n'+WORKER_GLUE],{type:'text/javascript'}));
    const w=new Worker(url);
    w.onmessage=e=>{
      const m=e.data,p=wkPend.get(m.id);if(!p)return;
      wkPend.delete(m.id);
      m.ok?p.ok(m):p.no(new Error(m.err||'decode failed'));
    };
    w.onerror=()=>{
      wkPend.forEach(p=>p.no(new Error('worker error')));
      wkPend.clear();wk=null;wkP=null;
    };
    wk=w;return w;
  })();
  wkP.catch(()=>{wkP=null});
  return wkP;
}
function workerDecode(file,opt){
  return new Promise((res,rej)=>{
    workerInstance().then(w=>{
      const id=++wkSeq;
      wkPend.set(id,{ok:res,no:rej});
      w.postMessage({id,file,maxEdge:opt.maxEdge,tileEdge:opt.tileEdge||0,tileQ:opt.tileQ||0,w:opt.w||0,h:opt.h||0});
    }).catch(rej);
  });
}

/* format + size detection */
async function sniffHeif(file){try{const b=new Uint8Array(await file.slice(0,64).arrayBuffer());
  if(b.length<12||String.fromCharCode(b[4],b[5],b[6],b[7])!=='ftyp')return false;
  return HEIF_BRANDS.includes(String.fromCharCode(b[8],b[9],b[10],b[11]).toLowerCase())}catch(e){return false}}
async function isHeif(it){if(it.heif!==undefined)return it.heif;
  if(HEIC_EXT.test(it.file.name)||/^image\/hei[cf]/i.test(it.file.type||''))return it.heif=true;
  return it.heif=await sniffHeif(it.file)}
async function heifSize(file,maxBytes){
  try{
    const buf=new Uint8Array(await file.slice(0,maxBytes||524288).arrayBuffer()),dv=new DataView(buf.buffer);
    let W=0,H=0;
    for(let i=0;i+16<=buf.length;i++){
      if(buf[i]===0x69&&buf[i+1]===0x73&&buf[i+2]===0x70&&buf[i+3]===0x65){
        const w=dv.getUint32(i+8),h=dv.getUint32(i+12);
        if(w>0&&h>0&&w<65535&&h<65535&&w*h>W*H){W=w;H=h}
      }
    }
    if(!(W&&H))return null;
    // a rotation box (irot) turns the stored size on its side, so a portrait iPhone
    // shot is not pre-sized as a landscape card
    let turn=0;
    for(let i=0;i+12<=Math.min(buf.length,4096);i++){
      if(buf[i]===0x69&&buf[i+1]===0x72&&buf[i+2]===0x6f&&buf[i+3]===0x74){turn=buf[i+8]&3;break}
    }
    if(turn===1||turn===3)return {w:H,h:W,rot:true};
    return {w:W,h:H};
  }catch(e){return null}
}

/* decode → ImageBitmap, capped to maxEdge (no JPEG, no intermediate file) */
async function heifBitmap(it,maxEdge){
  const lib=await heicLib(),s=await heifSize(it.file),opt={};
  if(maxEdge&&s&&Math.max(s.w,s.h)>maxEdge){
    if(s.w>=s.h)opt.resizeWidth=maxEdge;else opt.resizeHeight=maxEdge;
    opt.resizeQuality='high';
  }
  return lib({blob:it.file,type:'bitmap',options:opt});
}
async function paint(it,maxEdge,tileSpec){
  const size=await heifSize(it.file);
  try{
    const r=await workerDecode(it.file,{maxEdge,tileEdge:tileSpec?THUMB:0,tileQ:tileSpec?tileQuality():0,w:size?size.w:0,h:size?size.h:0});
    stats.worker++;
    if(!it.dims)it.dims={w:r.width,h:r.height};
    const c=document.createElement('canvas');
    c.width=r.width;c.height=r.height;
    c.getContext('2d').drawImage(r.bitmap,0,0);
    if(r.bitmap.close)r.bitmap.close();
    return {canvas:c,tile:r.tile||null,thread:'worker'};
  }catch(e){}
  const bmp=await heifBitmap(it,maxEdge);
  stats.main++;
  if(!it.dims)it.dims={w:bmp.width,h:bmp.height};
  try{
    const c=document.createElement('canvas');
    c.width=bmp.width;c.height=bmp.height;
    const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(bmp,0,0);
    return {canvas:c,tile:null,thread:'main'};
  }finally{bmp.close&&bmp.close()}
}
const tileQuality=()=>Math.min(.95,Math.max(.5,+S.set.tq||.82));

/* ---------- tile cache (small, optional) ---------- */
let tileIdx=null;
async function loadIdx(){
  if(tileIdx)return tileIdx;
  tileIdx=[];await openDB();if(!DB)return tileIdx;
  await new Promise(ok=>{try{
    const req=DB.transaction('tiles').objectStore('tiles').openCursor();
    req.onsuccess=e=>{const c=e.target.result;if(!c)return ok();const v=c.value||{};tileIdx.push({k:c.key,n:v.n||0,ts:v.ts||0});c.continue()};
    req.onerror=()=>ok();
  }catch(e){ok()}});
  return tileIdx;
}
async function tilesUsage(){const idx=await loadIdx();return idx.reduce((a,b)=>a+b.n,0)}
async function trimTiles(){
  if(!S.set.pcache)return;
  const idx=await loadIdx();
  let tot=idx.reduce((a,b)=>a+b.n,0);
  if(tot<=TILE_CAP)return;
  idx.sort((a,b)=>a.ts-b.ts);
  while(tot>TILE_CAP*.85&&idx.length){
    const o=idx.shift();
    await new Promise(ok=>{try{const r=DB.transaction('tiles','readwrite').objectStore('tiles').delete(o.k);r.onsuccess=()=>ok();r.onerror=()=>ok()}catch(e){ok()}});
    tot-=o.n;
  }
}
async function tileUrl(it){
  if(!S.set.pcache)return null;
  const hit=objUrls.get(it.key+'|tile');if(hit)return hit;
  const rec=await idbGet('tiles',it.key);
  return rec&&rec.blob?objUrl(it.key+'|tile',rec.blob):null;
}
async function saveTile(it,canvas){
  if(!S.set.pcache||!DB)return null;
  try{
    let src=canvas,tmp=null;
    const long=Math.max(canvas.width,canvas.height);
    if(long>THUMB){
      const k=THUMB/long;
      tmp=document.createElement('canvas');
      tmp.width=Math.max(1,Math.round(canvas.width*k));tmp.height=Math.max(1,Math.round(canvas.height*k));
      const g=tmp.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(canvas,0,0,tmp.width,tmp.height);
      src=tmp;
    }
    const tq=tileQuality();
    let blob=await new Promise(r=>src.toBlob(r,'image/webp',tq));
    if(!blob)blob=await new Promise(r=>src.toBlob(r,'image/jpeg',tq));
    if(tmp){tmp.width=tmp.height=1}
    if(!blob)return null;
    await idbPut('tiles',it.key,{blob,ts:Date.now(),n:blob.size});
    trimTiles();
    return objUrl(it.key+'|tile',blob,true);
  }catch(e){return null}
}
async function saveTileBlob(it,blob){
  if(!S.set.pcache||!DB||!blob)return null;
  try{
    await idbPut('tiles',it.key,{blob,ts:Date.now(),n:blob.size});
    trimTiles();
    return objUrl(it.key+'|tile',blob,true);
  }catch(e){return null}
}
async function clearPreviewCache(){
  await idbClear('tiles');tileIdx=null;
  [...objUrls.keys()].forEach(k=>{if(k.endsWith('|tile')){URL.revokeObjectURL(objUrls.get(k));objUrls.delete(k)}});

/* ---------- the card hugs the photo: no letterbox bars ---------- */

function cardCaps(){

  const narrow=innerWidth<=820;

function fitCard(){

/* ---------- composition guide lines ---------- */
function guideSVG(){
  const st=S.set.guides||'thirds';
  if(st==='off')return '';
  const col=S.set.gcol||'#ffffff';
  const w=Math.max(.5,Math.min(6,+S.set.gw||1));
  const o=Math.max(.05,Math.min(1,+S.set.gop));
  const L=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  let d='';
  if(st==='thirds')d=L(33.333,0,33.333,100)+L(66.667,0,66.667,100)+L(0,33.333,100,33.333)+L(0,66.667,100,66.667);
  else if(st==='golden'){const g=38.196;d=L(g,0,g,100)+L(100-g,0,100-g,100)+L(0,g,100,g)+L(0,100-g,100,100-g)}
  else if(st==='cross')d=L(50,0,50,100)+L(0,50,100,50);
  else if(st==='diag')d=L(0,0,100,100)+L(100,0,0,100);
  else if(st==='grid'){for(let i=10;i<100;i+=10)d+=L(i,0,i,100)+L(0,i,100,i)}
  return `<div class="gd"><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="stroke:${col};stroke-width:${w};opacity:${o}">${d}</svg></div>`;
}

/* ---------- compare two photos ---------- */
const cmp={a:null,b:null,back:'grid',seen:new Set(),src:'new'};
const cmpColName=id=>((cols().find(c=>c.id===id)||{n:''}).n);
function cmpPool(){return items.filter(i=>i.st===cmp.src&&tmatch(i)&&smatch(i)&&!cmp.seen.has(i.key))}
function cmpStart(ka,kb){
  const m=by();
  if(!ka||!kb||!m[ka]||!m[kb]||ka===kb){toast('Pick two photos to compare');return}
  cmp.a=ka;cmp.b=kb;cmp.seen=new Set([ka,kb]);
  cmp.back=view==='compare'?cmp.back:view;cmp.src=cur;
  view='compare';sel.clear();render();
}
function cmpFill(side){
  const p=cmpPool()[0];
  if(side==='a')cmp.a=p?p.key:null;else cmp.b=p?p.key:null;
  if(p)cmp.seen.add(p.key);
}
function cmpPane(side){
  const k=side==='a'?cmp.a:cmp.b,it=k?by()[k]:null,id='med'+(side==='a'?'A':'B');
  return `<div class="pane" data-side="${side}">
  <div class="cshot">${it?`<div class="med" id="${id}"></div>${guideSVG()}<div class="cap"><span>${esc(it.file.name)}</span><span>${esc(cmpColName(it.st))}</span></div>`
    :`<div class="slotempty">No photo in this slot.<br>Press Next pair to keep going.</div>`}</div>
  ${it?`<div class="judge"><button class="ok" data-cmp="final" data-side="${side}">${ic('check',15)} Keep</button><button data-cmp="later" data-side="${side}">${ic('clock',15)} Later</button><button class="bad" data-cmp="no" data-side="${side}">${ic('x',15)} Reject</button></div>`:''}</div>`;
}
function cmpPaint(slot){
  const el=document.querySelector(`.pane[data-side="${slot}"]`);if(!el)return;
  el.outerHTML=cmpPane(slot);
  const k=slot==='a'?cmp.a:cmp.b;
  if(k){const box=$('#med'+(slot==='a'?'A':'B')),it=by()[k];if(box&&it)mount(box,it,true)}
  fitCompare();
}
function fitCompare(){
  const A=cmp.a?by()[cmp.a]:null,B=cmp.b?by()[cmp.b]:null;
  const ars=[A&&A.dims?A.dims.w/A.dims.h:0,B&&B.dims?B.dims.w/B.dims.h:0].filter(v=>v>0);
  const ar=ars.length?Math.min(2.4,Math.max(.5,Math.max(...ars))):1.4;
  document.querySelectorAll('.cmp .cshot').forEach(shot=>{
    const pane=shot.closest('.pane');if(!pane)return;
    const pw=(pane.clientWidth||360)-24;
    shot.style.height=Math.round(Math.min(innerHeight*.56,Math.max(170,pw/ar)))+'px';
  });
}
function cmpHeader(){
  const el=$('#cmpinfo');if(!el)return;
  el.textContent=`${cnt(cmp.src)} left in ${cmpColName(cmp.src)||'this collection'} · ${cnt('final')} in Final cut`;
}
function cmpJudge(side,st){
  const k=side==='a'?cmp.a:cmp.b,it=k?by()[k]:null;if(!it)return;
  pushHist([{key:it.key,prev:it.st}]);
  setSt(it,st);
  if(st!=='final')cmpFill(side);
  cmpPaint(side);syncCounts();cmpHeader();
  if(!cmp.a&&!cmp.b){const w=$('.cmp');if(w)w.innerHTML=`<div class="empty"><h3>That is every photo in this collection</h3><p>Open another collection, or head back to the grid.</p></div>`}
  toast(st==='final'?'Kept':st==='no'?'Rejected':'Set aside',{label:'Undo',fn:()=>{undo();view='compare';render()}});
}
function rCompare(){
  const A=cmp.a?by()[cmp.a]:null,B=cmp.b?by()[cmp.b]:null;
  $('#body').innerHTML=`<div class="cmpwrap">
  <div class="cmpbar"><b>Compare</b><span id="cmpinfo" style="color:var(--mu);font-size:12.5px"></span><span class="sp"></span>
    <button data-cmpswap title="Swap the two sides">${ic('swap',15)} Swap</button>
    <button data-cmpnext>${ic('skip',15)} Next pair</button>
    <button data-cmpdone>${ic('check',15)} Done</button></div>
  <div class="cmp">${cmpPane('a')}${cmpPane('b')}</div>
  <div class="hintrow"><span><kbd>1</kbd> keep left</span><span><kbd>2</kbd> keep right</span><span><kbd>Q</kbd> reject left</span><span><kbd>W</kbd> reject right</span><span><kbd>S</kbd> swap</span><span><kbd>N</kbd> next pair</span><span><kbd>Z</kbd> undo</span><span><kbd>Esc</kbd> done</span></div></div>`;
  if(A)mount($('#medA'),A,true);
  if(B)mount($('#medB'),B,true);
  cmpHeader();fitCompare();
  requestAnimationFrame(fitCompare);
}
function cmpNextPair(){
  const pool=items.filter(i=>i.st===cmp.src&&tmatch(i)&&smatch(i));
  cmp.seen=new Set();
  const take=pool.filter(i=>i.key!==cmp.a&&i.key!==cmp.b).slice(0,2);
  cmp.a=take[0]?take[0].key:null;cmp.b=take[1]?take[1].key:null;
  if(!cmp.a&&!cmp.b){toast('Nothing left to compare here');return}
  rCompare();
}

/* ---------- mounting media ---------- */
function mount(box,it,full){
  const tok=box._t=Symbol();
  const alive=()=>box._t===tok;
  const dims=(w,h)=>noteDims(it,w,h,full&&alive());
  const put=el=>{if(!alive())return false;box.innerHTML='';box.appendChild(el);return true};
  const fail=msg=>{if(!alive())return;
    box.innerHTML=`<div style="font-size:12px;line-height:1.45">Couldn’t open<br><b style="font-weight:600;word-break:break-word">${esc(it.file.name)}</b>`
      +`<br><span style="opacity:.7;font-size:11px">${esc(msg)}</span>`
      +`<br><button data-retry="${esc(it.key)}" style="margin-top:10px;padding:6px 12px;border-radius:12px;font-size:11px;box-shadow:var(--us)">Retry</button></div>`};
  if(it.vid){
    box.innerHTML='';
    const m=document.createElement('video');
    m.muted=m.loop=m.playsInline=true;m.preload='metadata';
    if(full){m.controls=m.autoplay=true}
    m.onloadedmetadata=()=>dims(m.videoWidth,m.videoHeight);
    m.onerror=()=>fail('Video codec not supported in this browser (HEVC/H.265 video usually needs Safari).');
    m.src=objUrl(it.key+'|src',it.file)+(full?'':'#t=0.1');
    box.appendChild(m);return;
  }
  box.innerHTML=full?'<div class="spin"></div>':'<div class="skel"></div>';
  isHeif(it).then(heif=>{
    if(!alive())return;
    if(heif&&!it.dims)heifSize(it.file).then(s=>{if(s&&alive())dims(s.w,s.h)});
    if(!heif){
      const im=new Image();im.decoding='async';im.draggable=false;
      im.onload=()=>dims(im.naturalWidth,im.naturalHeight);
      im.onerror=()=>{ // mislabelled file? give libheif one shot
        if(!alive())return;
        sniffHeif(it.file).then(h=>{if(!alive())return;h?start():fail('This image format is not readable here.')});
      };
      im.src=objUrl(it.key+'|src',it.file);
      put(im);
      return;
    }
    start();
  }).catch(e=>fail(why(e)));

  async function start(){
    const edge=full?previewEdge():THUMB;
    const cached=await tileUrl(it);
    if(!alive())return;
    if(cached){
      const im=new Image();im.src=cached;im.draggable=false;
      im.onload=()=>dims(im.naturalWidth,im.naturalHeight);
      put(im);
      if(!full)return;                       // grid: the cached tile *is* the view
    }else if(alive()){
      box.innerHTML=full?'<div class="spin"></div>':'<div class="skel"></div>';
    }
    try{
      await slot();
      let res;try{res=await paint(it,edge,{cacheTile:true})}finally{free()}
      if(!alive())return;
      const c=res.canvas;
      it.err=null;it.painted=true;
      c.className='shot';
      dims(c.width,c.height);                 // card is already the right shape when the pixels land
      put(c);
      // refresh the small tile for next time, and (in grids) swap the canvas for the
      // cheap cached image so a long scroll doesn't keep dozens of canvases alive
      const keep=res.tile?saveTileBlob(it,res.tile):saveTile(it,c);
      keep.then(u=>{
        if(u&&!full&&alive()){const im=new Image();im.src=u;im.draggable=false;put(im)}
      });
    }catch(e){
      if(!alive())return;
      try{ // last resort for engines without resizable bitmaps: one JPEG, then show it
        const lib=await heicLib();
        const b=await lib({blob:it.file,type:'image/jpeg',quality:.9});
        if(!alive())return;
        const im=new Image();im.src=objUrl(it.key+'|jpg',Array.isArray(b)?b[0]:b);
        im.draggable=false;put(im);return;
      }catch(e2){}
      fail(why(e));
    }
  }
}
/* ---------- pre-cache every photo after a folder opens ---------- */
const pc={active:false,done:0,total:0,ok:0,fail:0,cancel:false};
function pcUI(){
  const el=$('#pc');if(!el)return;
  el.classList.toggle('hide',!pc.active&&!pc.total);
  const bar=$('#pcbar i');if(bar)bar.style.width=(pc.total?Math.round(pc.done/pc.total*100):0)+'%';
  const lab=$('#pclab');
  if(lab)lab.textContent=pc.active?('Caching '+pc.done+' of '+pc.total):(pc.ok?('Cached '+pc.ok+' tiles'):'');
  const x=$('#pcx');if(x)x.style.display=pc.active?'inline-flex':'none';
}
async function precacheAll(){
  if(!S.set.precache||pc.active)return;
  const queue=items.filter(i=>!i.vid);
  pc.active=true;pc.cancel=false;pc.total=queue.length;pc.done=0;pc.ok=0;pc.fail=0;pcUI();
  for(const it of queue){
    if(pc.cancel)break;
    try{
      if(await isHeif(it)){
        if(await tileUrl(it)){pc.ok++}
        else if(await prefetchTile(it)){pc.ok++}
        else{pc.fail++}
      }
    }catch(e){pc.fail++}
    pc.done++;pcUI();
    await new Promise(r=>setTimeout(r,10));

// decode one tile in the background. Returns a tile URL, or null on failure.
// Concurrent callers share the same promise, so a tile never decodes twice.
async function prefetchTile(it){
  if(!S.set.pcache||it.vid)return null;
  const have=await tileUrl(it);
  if(have)return have;
  if(it.prefetching)return it.prefetching;
  it.prefetching=(async()=>{
    try{
      if(!(await isHeif(it)))return null;
      await slot();
      let res;try{res=await paint(it,THUMB,{cacheTile:true})}finally{free()}
      if(!res)return null;
      return res.tile?saveTileBlob(it,res.tile):saveTile(it,res.canvas);
    }catch(e){return null}
    finally{it.prefetching=null}
  })();
  return it.prefetching;
}

/* ---------- zip writer (store only, no dependencies) ---------- */
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function dosTime(ms){const d=new Date(Math.max(ms||Date.now(),Date.UTC(1980,0,1)));
  return {t:((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,
          d:(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF}}
async function makeZip(entries){ // entries: [{path, file}] or [{path, text}]
  const parts=[],cdir=[];let off=0;
  for(const e of entries){
    const bytes=e.text!==undefined?new TextEncoder().encode(e.text):new Uint8Array(await e.file.arrayBuffer());
    const name=new TextEncoder().encode(e.path);
    const {t,d}=dosTime(e.file?e.file.lastModified:Date.now());
    const crc=crc32(bytes);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,t,true);lh.setUint16(12,d,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,bytes.length,true);lh.setUint32(22,bytes.length,true);
    lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,bytes);
    cdir.push({name,crc,size:bytes.length,off,t,d});
    off+=30+name.length+bytes.length;
  }
  const cdParts=[];let cdSize=0;
  for(const c of cdir){
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true);ch.setUint16(12,c.t,true);ch.setUint16(14,c.d,true);ch.setUint32(16,c.crc,true);
    ch.setUint32(20,c.size,true);ch.setUint32(24,c.size,true);
    ch.setUint16(28,c.name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
    ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,c.off,true);
    cdParts.push(new Uint8Array(ch.buffer),c.name);
    cdSize+=46+c.name.length;
  }
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(4,0,true);eo.setUint16(6,0,true);
  eo.setUint16(8,cdir.length,true);eo.setUint16(10,cdir.length,true);
  eo.setUint32(12,cdSize,true);eo.setUint32(16,off,true);eo.setUint16(20,0,true);
  return new Blob([...parts,...cdParts,new Uint8Array(eo.buffer)],{type:'application/zip'});
}
async function downloadZip(list,label){
  if(!list.length)return toast('Nothing to download');
  const total=list.reduce((a,i)=>a+i.file.size,0);
  if(total>1500*1024*1024)return toast('Too big for one zip ('+fmt(total)+'). Download a smaller collection.');
  toast('Building '+label+'.zip with '+list.length+' files…');
  const C=cols(),used={},entries=[];
  const manifest={app:SLUG,appName:NAME,at:new Date().toISOString(),label,
    collections:C.map(c=>c.n),files:[]};
  list.forEach((it,n)=>{
    const col=it.st||'new',c=C.find(x=>x.id===col)||C[0];
    const order=col==='final'?finals.indexOf(it.key):-1;
    const base=safeName(it.file.name)||'file';
    const dot=base.lastIndexOf('.'),stem=dot>0?base.slice(0,dot):base,ext=dot>0?base.slice(dot):'';
    const dir=(c.n==='Inbox'?'':safeName(c.n)+'/')+(order>=0?String(order+1).padStart(2,'0')+' - ':'');
    let path=dir+stem+ext,k=2;
    while(used[path]){path=dir+stem+' ('+(k++)+')'+ext}
    used[path]=1;
    entries.push({path,file:it.file});
    manifest.files.push({path,collection:c.n,order:order>=0?order+1:null,name:it.file.name,size:it.file.size});
  });
  entries.unshift({path:'manifest.json',text:JSON.stringify(manifest,null,2)});
  const zip=await makeZip(entries);
  saveBlob(zip,SLUG+'-'+safeName(label)+'.zip');
  toast('Downloaded '+list.length+' file'+(list.length===1?'':'s')+' ('+fmt(zip.size)+')');
}

async function primeDims(){

function drag(c){

  const m=by(),io=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting){io.unobserve(en.target);mount(en.target.querySelector('.med'),m[en.target.dataset.k],false)}
  }),{rootMargin:'300px'});
  root.querySelectorAll('.cell').forEach(c=>io.observe(c));
}
let vlist=[],vcells=new Map(),vgeom={cols:0,cw:0,rowH:0,gap:22};
const GRID_GAP=22,GRID_OVER=2;
function rGrid(){
  const d=deck();
  if(!d.length){
    vlist=[];vcells.clear();
    $('#body').innerHTML=`<div class="empty"><h3>${search?'No matches':'Nothing here yet'}</h3><p>${search?'Clear the search to see everything.':'Items you sort into this collection will show up here.'}</p></div>`;
    return;
  }
  vlist=d;vcells=new Map();
  $('#body').innerHTML='<div id="g" class="vgrid"></div>';
  layoutGrid();
}
let vRetry=0;
function layoutGrid(){
  const g=$('#g');if(!g||!vlist.length)return;
  const W=g.clientWidth||$('#body').clientWidth;
  if(!W){if(vRetry++<20)requestAnimationFrame(layoutGrid);return}
  vRetry=0;
  const cellMin=Math.max(96,+S.set.cell||158);
  const cols=Math.max(1,Math.floor((W+GRID_GAP)/(cellMin+GRID_GAP)));
  const cw=(W-GRID_GAP*(cols-1))/cols;
  const rowH=cw+GRID_GAP;
  const rows=Math.ceil(vlist.length/cols);
  const h=Math.max(0,+(rows*rowH-GRID_GAP).toFixed(2));
  if(g.style.height!==h+'px')g.style.height=h+'px';
  // column count changed: old cells sit on stale rows, so drop them and rebuild
  if(vgeom.cols!==cols||vgeom.cw!==cw){
    for(const el of vcells.values())el.remove();
    vcells.clear();
  }
  const gTop=g.getBoundingClientRect().top+window.scrollY;
  const vTop=window.scrollY,vBot=vTop+innerHeight;
  const rowA=Math.min(Math.max(0,Math.floor((vTop-gTop)/rowH)-GRID_OVER),Math.max(0,rows-1));
  const rowB=Math.min(rows,Math.max(1,Math.ceil((vBot-gTop)/rowH)+GRID_OVER));
  const start=rowA*cols;
  const end=Math.min(vlist.length,Math.max(rowB*cols,start+cols*3));
  vgeom={cols,cw,rowH,gap:GRID_GAP};
  for(const [i,el] of [...vcells]) if(i<start||i>=end||!el.isConnected){el.remove();vcells.delete(i)}
  for(let i=start;i<end;i++){
    if(vcells.has(i))continue;
    const it=vlist[i];if(!it)continue;
    const r=Math.floor(i/cols),c=i%cols;
    const el=document.createElement('div');
    el.className='cell vcell'+(sel.has(it.key)?' sel':'');
    el.dataset.k=it.key;
    el.style.width=cw+'px';el.style.height=cw+'px';
    el.style.transform=`translate3d(${c*(cw+GRID_GAP)}px,${r*rowH}px,0)`;
    el.innerHTML=`<div class="med"></div><span class="tick">${ic('check',13)}</span><button class="open" data-open="${esc(it.key)}" title="Open in swipe view">${ic('expand',14)}</button><button class="kill" data-kill="${esc(it.key)}" title="Reject this photo">${ic('x',14)}</button>`;
    g.appendChild(el);vcells.set(i,el);
    mount(el.querySelector('.med'),it,false);
  }
}
let gridTick=0;
addEventListener('scroll',()=>{
  if(!$('#g')||gridTick)return;
  gridTick=requestAnimationFrame(()=>{gridTick=0;layoutGrid()});
},{passive:true});
addEventListener('resize',()=>{if($('#g'))layoutGrid()},{passive:true});

function rFinal(){
  const m=by(),n=finals.length,list=finals.map(k=>m[k]).filter(Boolean);
  $('#body').innerHTML=`<div class="two"><div><div class="panel"><h3>Carousel order <span style="color:var(--mu);font-weight:400">&nbsp;<b class="${n>20?'over':''}">${n}</b> of 20</span></h3><p style="color:var(--mu);margin:0 0 20px;font-size:12px">Instagram carousels hold up to 20 slides. Slide 1 is your cover.</p>
  ${n?`<div class="grid" id="fg">${list.map((i,x)=>`<div class="cell" data-k="${esc(i.key)}"><span class="num">${x+1}</span><div class="med"></div><div class="ord"><button data-m="-1">${ic('l',15)}</button><button data-m="x">${ic('x',15)}</button><button data-m="1">${ic('r',15)}</button></div></div>`).join('')}</div>
  <p class="btnrow"><button id="cmppairs">${ic('swap',15)} Compare two at a time</button><button id="cp">${ic('copy',15)} Copy filenames in order</button><button id="dlfinal">${ic('dl',15)} Download these files</button> <span id="cpm" style="color:var(--mu);font-size:12px"></span></p>`:'<div class="empty">No final picks yet. Press the up arrow while swiping.</div>'}</div></div>
  <div><div class="panel"><h3>Music ideas</h3><div class="chips">${Object.keys(MOODS).map(k=>`<button data-mo="${k}" class="${k===mood?'on':''}">${k}</button>`).join('')}</div>
  ${MOODS[mood].map(([a,s])=>`<div class="song"><span>${esc(s)}<br><span style="color:var(--mu);font-size:12px">${esc(a)}</span></span><span><a target="_blank" rel="noopener" href="https://open.spotify.com/search/${encodeURIComponent(a+' '+s)}">Spotify</a><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(a+' '+s)}">YouTube</a></span></div>`).join('')}
  <p style="color:var(--mu);font-size:12px;margin-bottom:0">A starter list. Add the actual track in Instagram’s music picker when you post.</p></div>
  <div class="panel"><h3>Notes and caption</h3><textarea id="nt" placeholder="Caption ideas, chosen song…">${esc(notes)}</textarea></div></div></div>`;
  if(n)lazy($('#fg'));
  const nt=$('#nt');if(nt)nt.oninput=e=>{notes=e.target.value;save()};
}
function bulk(){
  const b=$('#bulk');
  if(!sel.size||view!=='grid'){b.style.display='none';return}
  b.style.display='flex';
  b.innerHTML=`<b style="margin-right:2px">${sel.size} selected</b>
  ${sel.size===2?`<button data-cmp2 style="color:#1f6feb">${ic('swap',14)} Compare</button>`:''}
  <button data-selall>All</button><button data-selnone>None</button>
  ${cols().filter(c=>c.id!==cur).map(c=>`<button data-mv="${c.id}"><i style="width:9px;height:9px;border-radius:50%;background:${c.col}"></i>${esc(c.n)}</button>`).join('')}
  <button data-clr>${ic('x',14)}</button>`;
}

/* ---------- settings sheet ---------- */
function renderSheet(){
  if(sheet!=='settings')return;
  const el=$('#sheet');
  el.innerHTML=`<div class="pane">
  <div class="shead"><div style="flex:1"><h3>Settings</h3><p class="sub">Everything below is stored on this device only.</p></div>
  <button data-close class="x" title="Close">${ic('x',18)}</button></div>
  <div class="sbody">
  <div class="sec"><h4>Appearance</h4>
    <div class="row"><div class="lab"><b>Theme</b><small>Follow the system, or force light or dark.</small></div>
      <div class="end"><button class="dd sm" data-dd="theme"><span>${esc(DD_LABEL.theme())}</span><span class="car">${ic('skip',14)}</span></button></div></div>
    <div class="row"><div class="lab"><b>Thumbnail size</b><small>How big cells are in the grid.</small></div>
      <div class="end"><button class="dd sm" data-dd="cell"><span>${esc(DD_LABEL.cell())}</span><span class="car">${ic('skip',14)}</span></button></div></div>
  </div>

  <div class="sec"><h4>Guide lines</h4>
    <div class="row"><div class="lab"><b>Overlay</b><small>Composition lines over the photo in swipe and compare. Nothing is baked into your files.</small></div>
      <div class="end"><button class="dd sm" data-dd="guides"><span>${esc(DD_LABEL.guides())}</span><span class="car">${ic('skip',14)}</span></button></div></div>
    <div class="row"><div class="lab"><b>Colour</b><small>Line colour and how visible they are.</small></div>
      <div class="end"><input id="gcol" type="color" value="${esc(S.set.gcol||'#ffffff')}" title="Line colour"><input id="gop" type="range" min="10" max="100" step="5" value="${Math.round((+S.set.gop||.5)*100)}"></div></div>
    <div class="row"><div class="lab"><b>Line width</b><small>${(+S.set.gw||1)} px.</small></div>
      <div class="end"><input id="gw" type="range" min="1" max="4" step="1" value="${Math.min(4,Math.max(1,+S.set.gw||1))}"></div></div>
  </div>

  <div class="sec"><h4>Previews</h4>
    <div class="row"><div class="lab"><b>Full-screen size</b><small>Pixels rendered for the big preview. Smaller is faster and uses less memory; the grid always uses the cached tiles.</small></div>
      <div class="end"><button class="dd sm" data-dd="prev"><span>${esc(DD_LABEL.prev())}</span><span class="car">${ic('skip',14)}</span></button></div></div>
    <div class="row"><div class="lab"><b>Cached tile quality</b><small>${Math.round((+S.set.tq||.82)*100)}%. Size against sharpness of the grid tiles. The full-screen view is unaffected.</small></div>
      <div class="end"><input id="tq" type="range" min="50" max="95" step="1" value="${Math.round((+S.set.tq||.82)*100)}"></div></div>
    <div class="row"><div class="lab"><b>Parallel decoding</b><small>How many HEICs decode at once. Lower if the fan spins up.</small></div>
      <div class="end"><button class="dd sm" data-dd="par"><span>${esc(DD_LABEL.par())}</span><span class="car">${ic('skip',14)}</span></button></div></div>
  </div>

  <div class="sec"><h4>Offline cache</h4>
    <div class="row"><div class="lab"><b>Pre-cache on open</b><small>Reads every HEIC once after you pick a folder and stores one small tile per photo. Slower start, instant grids later, fully offline.</small></div>
      <div class="end"><button class="sw" data-toggle="precache" aria-pressed="${S.set.precache?'true':'false'}"></button></div></div>
    <div class="row"><div class="lab"><b>Keep cached tiles</b><small>Stores one small tile per photo so grids come back instantly and work offline. Viewing itself never converts anything.</small></div>
      <div class="end"><button class="sw" data-toggle="pcache" aria-pressed="${S.set.pcache?'true':'false'}"></button></div></div>
    <div class="row"><div class="lab"><b>Cached tiles</b><small id="cacheInfo">Checking…</small></div>
      <div class="end"><button data-act="clearCache" class="dgr">${ic('trash',15)} Clear</button></div></div>
    <div class="row"><div class="lab"><b>HEIC decoder</b><small id="decInfo">${decState==='idle'?'Not downloaded yet. Fetched the first time you open a HEIC, then kept offline.':(decState==='cached'?'Stored locally ('+DEC_VER+'). Works offline.':decState==='ready'?'Downloaded from '+decFrom+' and stored locally.':decState==='failed'?'Could not download. Check your connection.':'Downloading…')}</small></div>
      <div class="end"><button data-act="fetchDec">Cache now</button></div></div>
  </div>

  <div class="sec"><h4>Sorting data</h4>
    <div class="row"><div class="lab"><b>Download sort map</b><small>A small JSON file with every decision, your collections, order and notes. Restore it later to sort the same folder instantly.</small></div>
      <div class="end"><button data-act="export">${ic('dl',15)} Download</button></div></div>
    <div class="row"><div class="lab"><b>Restore sort map</b><small>Load a downloaded sort map and apply it to the current folder.</small></div>
      <div class="end"><button data-act="import">${ic('up',15)} Choose file</button></div></div>
    <div class="row"><div class="lab"><b>Download sorted files</b><small>One zip with a folder per collection (plus a manifest). Final cut slides are numbered.</small></div>

  el.classList.add('on');

async function updateCacheInfo(){
  const box=$('#cacheInfo');if(!box)return;
  const used=await tilesUsage();
  const ok=!!DB;
  box.textContent=ok?`${fmt(used)} in use${used?' · oldest tiles are dropped past '+fmt(TILE_CAP):''}`:'Local storage is unavailable here, so tiles are not cached between visits.';
}
function refreshDecInfo(){
  const d=$('#decInfo');if(!d)return;
  d.textContent=decState==='idle'?'Not downloaded yet. Fetched the first time you open a HEIC, then kept offline.'
    :decState==='loading'?'Downloading…'
    :decState==='cached'?`Stored locally (${DEC_VER}). Works offline.`
    :decState==='ready'?`Downloaded from ${decFrom} and stored locally.`
    :'Could not download. Check your connection.';
}
function openSheet(name){sheet=name;renderSheet()}
function closeSheet(){sheet=null;const el=$('#sheet');el.classList.remove('on');el.innerHTML=''}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target,g=s=>t.closest(s);
  let el;
  if(menuEl&&!g('.menu')&&!g('[data-dd]'))closeMenu();
  if(g('[data-close]')||(t.id==='sheet')){return closeSheet()}
  if(el=g('[data-dd]')){e.stopPropagation();const spec=DD[el.dataset.dd];if(spec)openMenu(el,spec());return}
  if(el=g('[data-toggle]')){
    const k=el.dataset.toggle;
    S.set[k]=!S.set[k];save();
    el.setAttribute('aria-pressed',S.set[k]?'true':'false');
    if(k==='precache'&&S.set.precache&&items.length)setTimeout(()=>{pc.total=0;precacheAll()},200);
    if(k==='pcache'&&!S.set.pcache)clearPreviewCache();
    return;
  }
  if(g('[data-pcancel]')){stopPrecache();return}
  if(el=g('[data-act]'))return sheetAction(el.dataset.act);
  if(el=g('[data-dl]')){downloadZip(deck().filter(i=>!search||smatch(i)),(cols().find(c=>c.id===cur)||{n:'dump'}).n);return}
  if(g('#openSet')){return openSheet('settings')}
  if(!items.length)return;
  if(el=g('[data-del]')){e.stopPropagation();const id=el.dataset.del;
    items.forEach(i=>{if(i.st===id)setSt(i,'new')});
    S.cols=(S.cols||[]).filter(c=>c.id!==id);if(cur===id)cur='new';save();return render()}
  if(el=g('[data-retry]')){e.stopPropagation();const m=by(),it=m[el.dataset.retry];if(!it)return;
    it.err=null;it.painted=false;it.prefetching=null;it.heif=undefined;
    const box=el.closest('.med');
    return box?mount(box,it,box.closest('.cell')?false:true):render()}
  if(el=g('[data-c]')){cur=el.dataset.c;idx=0;sel.clear();search='';return render()}
  if(g('#addc')){const v=$('#nc').value.trim();if(v){S.cols=[...(S.cols||[]),{id:'c'+Date.now().toString(36),n:v}];save();render()}return}
  if(g('#reopen')){$('#inDir').click();return}
  if(el=g('[data-v]')){view=el.dataset.v;sel.clear();return render()}
  if(el=g('[data-a]')){el.dataset.a==='undo'?undo():act(el.dataset.a);return}
  if(el=g('[data-qclear]')){search='';return render()}
  if(el=g('[data-kill]')){e.stopPropagation();const it=by()[el.dataset.kill];if(!it)return;
    pushHist([{key:it.key,prev:it.st}]);setSt(it,'no');sel.delete(it.key);
    bodyOnly();syncCounts();toast('Rejected '+it.file.name,{label:'Undo',fn:undo});return}
  if(g('[data-cmp2]')){const two=[...sel];if(two.length===2)return cmpStart(two[0],two[1]);return}
  if(el=g('[data-cmp]')){e.stopPropagation();return cmpJudge(el.dataset.side,el.dataset.cmp)}
  if(g('[data-cmpswap]')){const t=cmp.a;cmp.a=cmp.b;cmp.b=t;return rCompare()}
  if(g('[data-cmpnext]')){return cmpNextPair()}
  if(g('[data-cmpdone]')){view=cmp.back==='compare'?'grid':cmp.back;return render()}
  if(g('#cmppairs')){const m=by(),list=finals.map(k=>m[k]).filter(Boolean);
    if(list.length<2){toast('Add at least two photos to the final cut first');return}
    cmp.src='final';return cmpStart(list[0].key,list[1].key)}
  if(el=g('[data-open]')){e.stopPropagation();view='swipe';idx=Math.max(0,deck().findIndex(i=>i.key===el.dataset.open));sel.clear();return render()}
  if(g('[data-selall]')){deck().forEach(i=>sel.add(i.key));rGrid();bulk();return}
  if(g('[data-selnone]')){sel.clear();rGrid();bulk();return}
  if(el=g('[data-mv]')){
    const m=by(),rec=[];sel.forEach(k=>{const it=m[k];if(it){rec.push({key:k,prev:it.st});setSt(it,el.dataset.mv)}});
    pushHist(rec);const n=sel.size;sel.clear();bodyOnly();syncCounts();
    toast(`Moved ${n} file${n===1?'':'s'}`,{label:'Undo',fn:undo});return}
  if(g('[data-clr]')){sel.clear();return render()}
  if(g('#more')){lim+=90;return rGrid()}
  if(el=g('[data-mo]')){mood=el.dataset.mo;save();return rFinal()}
  if(el=g('[data-m]')){const k=el.closest('.cell').dataset.k,i=finals.indexOf(k);
    if(el.dataset.m==='x')setSt(by()[k],'keep');else{const j=i+ +el.dataset.m;if(j<0||j>=finals.length)return;[finals[i],finals[j]]=[finals[j],finals[i]];save()}return render()}
  if(g('#cp')){const m=by(),txt=finals.map(k=>m[k].file.name).join('\n');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{$('#cpm').textContent='Copied';toast('Filenames copied')}).catch(()=>{toast('Copy blocked. Select the text manually.');$('#cpm').textContent=txt.replace(/\n/g,', ')});return}
  if(g('#dlfinal')){downloadZip(finals.map(k=>by()[k]).filter(Boolean),'final-cut');return}
  if(el=g('#g .cell')){const k=el.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);el.classList.toggle('sel');bulk()}
});
async function sheetAction(a){
  if(a==='settings')return openSheet('settings');
  if(a==='export')return exportSession();
  if(a==='import')return $('#inMap').click();
  if(a==='zipall'){
    if(!items.length)return toast('Load some files first');
    return downloadZip(items.slice(),'all-sorted');
  }
  if(a==='clearCache')return clearPreviewCache();
  if(a==='fetchDec'){
    toast('Caching the HEIC decoder…');
    try{await heicLib();toast('Decoder cached. HEIC works offline.');refreshDecInfo()}
    catch(e){toast(why(e));refreshDecInfo()}
    return;
  }
  if(a==='reset'){
    if(!confirm('Reset collections, decisions, notes and settings on this device? Downloaded sort maps are not affected.'))return;
    try{localStorage.removeItem(SLUG);localStorage.removeItem('dump1')}catch(e){}
    await openDB();
    try{DB&&DB.transaction('media','readwrite').objectStore('media').clear()}catch(e){}
    mediaIdx=[];S={};S.set={...DEF};finals=[];notes='';hist=[];sel.clear();
    items.forEach(i=>{i.st='new';i.painted=false;i.prefetching=null});
    applyTheme();applyCss();closeSheet();render();toast('Reset. Starting fresh');
    return;
  }
}
document.addEventListener('change',e=>{
  if(e.target.id==='tq'){
    S.set.tq=(+e.target.value)/100;save();
    const lab=e.target.closest('.row').querySelector('small');
    if(lab)lab.textContent=Math.round(S.set.tq*100)+'%. Size against sharpness of the grid tiles. The full-screen view is unaffected.';
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){search=e.target.value;
    const clr=document.querySelector('[data-qclear]');if(clr)clr.style.display=search?'inline-flex':'none';
    const c=$('#cnt');if(c)c.textContent=cntText();
    bodyOnly();return}
  if(e.target.id==='nt'){notes=e.target.value;save()}
  if(e.target.id==='gcol'){S.set.gcol=e.target.value;save();guideLive()}
  if(e.target.id==='gop'){S.set.gop=+e.target.value/100;save();guideLive()}
  if(e.target.id==='gw'){S.set.gw=+e.target.value;save();guideLive();
    const l=e.target.closest('.row').querySelector('small');if(l)l.textContent=(+S.set.gw)+' px.'}
});
function guideLive(){
  document.querySelectorAll('#card, .cmp .pane, .cmp .cshot').forEach(host=>{
    const old=host.querySelector(':scope > .gd');if(old)old.remove();
  });
  const html=guideSVG();
  if(!html)return;
  const card=$('#card');
  if(card){card.insertAdjacentHTML('beforeend',html)}
  document.querySelectorAll('.cmp .cshot').forEach(shot=>shot.insertAdjacentHTML('beforeend',html));
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(menuEl){closeMenu();return}
    if(sheet){closeSheet();return}
    if(view==='compare'){view=cmp.back==='compare'?'grid':cmp.back;return render()}
    if(e.target.id==='q'&&search){search='';e.target.value='';const clr=$('[data-qclear]');if(clr)clr.style.display='none';const c=$('#cnt');if(c)c.textContent=cntText();bodyOnly();}
    if(e.target.blur)e.target.blur();
    return;
  }
  const typing=/TEXTAREA|SELECT|INPUT/.test(e.target.tagName);
  if(e.key==='/'&&!typing){e.preventDefault();const s=$('#q');s&&s.focus();return}
  if(e.key===','&&!typing){e.preventDefault();return openSheet('settings')}
  if(!items.length||typing)return;
  if(view==='compare'){
    const map={'1':['a','final'],'2':['b','final'],q:['a','no'],w:['b','no']};
    const hit=map[e.key.toLowerCase()];
    if(hit){e.preventDefault();return cmpJudge(hit[0],hit[1])}
    const low=e.key.toLowerCase();
    if(low==='s'){e.preventDefault();const t=cmp.a;cmp.a=cmp.b;cmp.b=t;return rCompare()}
    if(low==='n'){e.preventDefault();return cmpNextPair()}
    if(e.key==='z'||e.key==='Backspace'){e.preventDefault();undo();return rCompare()}
    return;
  }
  if(e.key.toLowerCase()==='c'&&(view==='swipe'||view==='grid')){
    e.preventDefault();
    if(view==='grid'){const two=[...sel];
      if(two.length===2)return cmpStart(two[0],two[1]);
      const d=deck();
      if(d.length>=2)return cmpStart(d[0].key,d[1].key);
      return toast('Pick two photos to compare')}
    return act('compare');
  }
  if(view!=='swipe')return;
  const k={ArrowRight:'keep',ArrowLeft:'no',' ':'later',ArrowUp:'final',ArrowDown:'skip'}[e.key];
  if(k){e.preventDefault();act(k)}else if(e.key==='z'||e.key==='Backspace'){e.preventDefault();undo()}
  else if(/^[1-9]$/.test(e.key)&&cols()[+e.key-1]){act(cols()[+e.key-1].id)}
});
setInterval(()=>{if(sheet==='settings')refreshDecInfo()},1200);
